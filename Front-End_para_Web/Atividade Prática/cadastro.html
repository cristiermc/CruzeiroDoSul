<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Apoiador - ONG Esperança Viva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">ONG Esperança Viva</div>
        <nav aria-label="Navegação Principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos Sociais</a></li>
                <li><a href="cadastro.html" class="active">Seja Voluntário</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Cadastro de Apoiadores e Voluntários</h1>
            <p>Preencha os campos abaixo para fazer parte da nossa rede de apoio social.</p>
            
            <form action="#" method="POST">
                <legend>Dados Pessoais</legend>

                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="3" placeholder="Digite seu nome completo">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required placeholder="seu@email.com">
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF *</label>
                        <input
                           type="text"
                           id="cpf"
                           name="cpf"
                           required
                           pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                           placeholder="000.000.000-00"
                           maxlength="14"
                           title="Digite o CPF no formato 000.000.000-00"
                        >
                        <small>Formato: 000.000.000-00</small>
                    </div>
                </div>
            </form>
        </section>
    </main>
    
</body>
</html>
